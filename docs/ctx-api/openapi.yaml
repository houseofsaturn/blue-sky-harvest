openapi: 3.1.0
info:
  title: ctx REST API
  description: >-
    This is the documentation for the public ctx REST API.


    ## Rate limits for API keys


    All API keys on one account share one set of rate-limit budgets. They are
    separate from the budgets of that user's browser session: a key cannot spend
    the session's budget, and the session cannot spend the key's.


    Rate limits are subject to change. See current limits in the table below for
    reference.


    - **Every request** made with a key counts against a ceiling of 20 requests
    per second, with up to 200 back to back.

    - **Some routes** (the costly and abuse-prone ones) also count against a
    budget of their own. With a key, each is:


    | Budget | Calls | Staff account's keys |

    |---|---|---|

    | `signup` | 10 per hour | 10 per hour |

    | `password-reset` | 5 per hour | 5 per hour |

    | `invite-validate` | 30 per hour | 30 per hour |

    | `invite-code-validate` | 30 per hour | 30 per hour |

    | `invite-send` | 20 per day | 20 per day |

    | `community-post` | 60 per hour | 60 per hour |

    | `ple-add` | 60 per hour | no budget |

    | `gardener-suggest` | 10 per day | 10 per day |

    | `link-check` | 30 per hour | no budget |

    | `label-collage-create` | 10 per hour | no budget |

    | `rescan` | 10 per hour | no budget |

    | `library-import-upload` | 5 per hour | no budget |

    | `library-import-undo` | 10 per hour | no budget |

    | `apple-library-import` | 5 per hour | no budget |

    | `library-export` | 6 per hour | no budget |

    | `bandcamp-claim` | 10 per hour | no budget |

    | `bandcamp-verify` | 10 per hour | no budget |

    | `url-add` | 60 per hour | no budget |

    | `artist-add` | 60 per hour | no budget |

    | `bandcamp-resync` | 4 per hour | no budget |

    | `feedback` | 5 per day | 5 per day |

    | `upload` | 20 per hour | 20 per hour |

    | `library-import-preview` | 10 per hour | no budget |

    | `collage-feed` | 300 per hour | 300 per hour |


    A staff account's keys skip the budgets marked "no budget". They still count
    against the ceiling, and against every other budget.


    A call over a budget is answered `429` with `{"detail": "Request was
    throttled. Expected available in N seconds."}` and a `Retry-After: N` header
    (seconds). A refused call counts nothing. Wait N seconds before you call
    again.
  version: "0"
