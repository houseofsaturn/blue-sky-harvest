components:
  schemas:
    AccountAccess:
      properties:
        access:
          type: string
      required:
        - access
      type: object
    AccountLoginBody:
      properties:
        password:
          type: string
        username:
          type: string
      required:
        - username
        - password
      type: object
    AccountNewUser:
      properties:
        email:
          type: string
        id:
          format: int64
          type: integer
        username:
          type: string
      required:
        - id
        - username
        - email
      type: object
    AccountPair:
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
        - refresh
        - access
      type: object
    AccountRefreshBody:
      properties:
        refresh:
          type: string
      required:
        - refresh
      type: object
    AccountResetBody:
      properties:
        email:
          format: email
          type: string
      required:
        - email
      type: object
    AccountResetConfirmBody:
      properties:
        new_password:
          type: string
        token:
          type: string
        uid:
          type: string
      required:
        - uid
        - token
        - new_password
      type: object
    AccountSignedUp:
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: "#/components/schemas/AccountNewUser"
      required:
